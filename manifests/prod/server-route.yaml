apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: server-route-prod
  namespace: eliopeli
  labels:
    app: eliopeli-prod
    type: external
spec:
  host: eliopeli-prod.ext.ocp-prod-0.k8s.it.helsinki.fi 
  path: /api
  to:
    kind: Service
    name: server-prod-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None