apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: eliopeli-route-prod
  namespace: eliopeli
  labels:
    app: eliopeli-prod
    type: external
spec:
  # TODO move to ocp-prod-0
  host: eliopeli.ext.ocp-test-0.k8s.it.helsinki.fi
  port:
    targetPort: 4173
  to:
    kind: Service
    name: eliopeli-prod-svc
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None