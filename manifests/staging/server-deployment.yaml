apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-staging-dep
  namespace: eliopeli
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"server:staging","namespace":"eliopeli"},"fieldPath":"spec.template.spec.containers[?(@.name==\"server\")].image","pause":"false"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-staging
  template:
    metadata:
      labels:
        app: server-staging
    spec:
      containers:
        - name: server
          image: server:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: admin-auth
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "100Mi"
              cpu: "100m"