apiVersion: apps/v1
kind: Deployment
metadata:
  name: eliopeli-staging-dep
  namespace: eliopeli
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"eliopeli:staging","namespace":"eliopeli"},"fieldPath":"spec.template.spec.containers[?(@.name==\"eliopeli\")].image","pause":"false"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eliopeli-staging
  template:
    metadata:
      labels:
        app: eliopeli-staging
    spec:
      containers:
        - name: eliopeli
          image: eliopeli:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 4173
          resources:
            limits:
              memory: "1024Mi"
              cpu: "1000m"
            requests:
              memory: "50Mi"
              cpu: "50m"
