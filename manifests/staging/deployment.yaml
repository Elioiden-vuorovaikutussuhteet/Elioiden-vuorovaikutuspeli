       #- name: nginx
         #image: nginx:latest
         #ports:
           #- containerPort: 80
         #volumeMounts:
          #- name: nginx-config
             #mountPath: /etc/nginx/conf.d/default.conf
             #subPath: default.conf

      #volumes:
        #- name: nginx-config
          #configMap:
            #name: nginx-config
