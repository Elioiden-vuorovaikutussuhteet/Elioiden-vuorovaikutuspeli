kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: eliopeli
  labels:
    app: eliopeli-staging
spec:
  lookupPolicy:
    local: false
  tags:
    - name: staging
      from:
        kind: DockerImage
        name: ghcr.io/Elioiden-vuorovaikutussuhteet/Elioiden-vuorovaikutuspeli:staging
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Local