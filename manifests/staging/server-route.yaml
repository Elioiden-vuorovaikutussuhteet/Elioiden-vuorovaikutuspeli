apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: server-route-staging
  namespace: eliopeli
spec:
  host: eliopeli-staging.ext.ocp-test-0.k8s.it.helsinki.fi
  path: /api
  to:
    kind: Service
    name: server-staging-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None