apiVersion: v1
kind: Service
metadata:
  name: eliopeli-staging-svc
  namespace: eliopeli
  labels:
    app: eliopeli-staging
spec:
  selector:
    app: eliopeli-staging
  ports:
    - name: http
      port: 80         
      targetPort: 4173 #change to 80 so it targets nginx proxy port
  type: ClusterIP